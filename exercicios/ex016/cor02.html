<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * { /*configurações globais das CSS*/
            height: 100%;
        }
        body { 
            background-image: linear-gradient(190deg, #7E42B5, #A03BA7, #C7358B, #DB3D5F, #EB5850, #F38359, #FAAC63);
            background-attachment:fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
